[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veridelta"
dynamic = ["version"]
description = "GraphRAG-grounded change impact analysis for UVM verification environments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Emilija Velinova" },
  { name = "Katerina Velinova" },
]
keywords = ["UVM", "SystemVerilog", "hardware verification", "change impact analysis", "GraphRAG", "LLM"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["networkx>=3.0"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
paper = ["openpyxl>=3.1", "matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
veridelta = "veridelta.cli:main"

[tool.setuptools.dynamic]
version = { attr = "veridelta.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
